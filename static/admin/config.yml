backend:
  name: github
  repo: Osterlen-Budo/web
  branch: main # Branch to update (optional; defaults to master)

local_backend: true

media_folder: 'static/images'
public_folder: '/images'

collections:
  - name: 'Pages'
    label: 'Sidor'
    folder: 'src/pages'
    create: false
    slug: '{{slug}}'
    fields:
      - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'page' }
      - { label: 'Titel', name: 'title', widget: 'string' }
      - { label: 'Datum', name: 'date', widget: 'datetime' }
      - { label: 'Beskrivning', name: 'description', widget: 'string' }
      - { label: 'Text', name: 'body', widget: 'markdown' }

  - name: 'nyheter'
    label: 'Nyheter'
    folder: 'src/pages/news'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'nyhet' }
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Bild', name: 'image', widget: 'image' }
      - { label: 'Datum', name: 'date', widget: 'datetime' }
      - { label: 'Publicerad', name: 'published', widget: 'boolean', default: true }
      - { label: 'Body', name: 'body', widget: 'markdown' }

  - name: 'kalendarium'
    label: 'Kalendarium'
    delete: false
    editor:
      preview: false
    files:
      - name: 'kalendarium'
        label: 'Kalendarium (Händelser)'
        file: 'src/pages/kalendarium.json'
        fields:
          - { label: 'Titel', name: 'title', widget: 'string', default: 'Kalendarium HT2026' }
          - { label: 'Beskrivning', name: 'description', widget: 'string', default: 'Viktiga datum, tävlingar och aktiviteter under terminen.' }
          - label: 'Händelser'
            name: 'events'
            widget: 'list'
            summary: '{{fields.date}} – {{fields.title}} ({{fields.location}})'
            fields:
              - { label: 'Datum / Period', name: 'date', widget: 'string', hint: 'T.ex. "17 Aug", "24–30 Aug" eller "3 Okt"' }
              - { label: 'Tid', name: 'time', widget: 'string', required: false, hint: 'T.ex. "18:30 – 20:00" eller "Hela dagen"' }
              - { label: 'Vad (Aktivitet / Tävling)', name: 'title', widget: 'string' }
              - { label: 'Var (Plats)', name: 'location', widget: 'string', required: false, default: 'Dojon' }
              - { label: 'För vem', name: 'forWhom', widget: 'string', required: false, default: 'Alla medlemmar' }

  - name: 'dokument'
    label: 'Dokument'
    delete: false
    editor:
      preview: false
    files:
      - name: 'dokument'
        label: 'Dokumentbank'
        file: 'src/pages/dokument.json'
        fields:
          - { label: 'Titel', name: 'title', widget: 'string', default: 'Dokument' }
          - { label: 'Beskrivning', name: 'description', widget: 'string', default: 'Här samlar vi officiella föreningsdokument, gällande stadgar, årsmötesprotokoll, verksamhetsberättelser och klubbens policys.' }
          - label: 'Standardvy'
            name: 'defaultView'
            widget: 'select'
            options:
              - { label: 'Kortvy (Grid)', value: 'cards' }
              - { label: 'Listvy (Kompakt lista)', value: 'list' }
            default: 'cards'
          - label: 'Dokument'
            name: 'documents'
            widget: 'list'
            summary: '{{fields.title}} ({{fields.category}}) – {{fields.date}}'
            fields:
              - { label: 'Dokumentnamn', name: 'title', widget: 'string' }
              - label: 'Kategori'
                name: 'category'
                widget: 'select'
                options:
                  - { label: 'Stadgar', value: 'governance' }
                  - { label: 'Policy', value: 'policy' }
                  - { label: 'Årsmötesprotokoll', value: 'protocol' }
                  - { label: 'Verksamhetsberättelse', value: 'report' }
                  - { label: 'Övrigt dokument', value: 'other' }
                default: 'protocol'
              - { label: 'Datum', name: 'date', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
              - { label: 'Fil (PDF)', name: 'file', widget: 'file', media_folder: 'static/files', public_folder: '/files' }
              - { label: 'Kort beskrivning', name: 'description', widget: 'string', required: false }

  - name: 'avgifter'
    label: 'Avgifter'
    delete: false
    editor:
      preview: false
    files:
      - name: 'avgifter'
        label: 'Träningsavgifter'
        file: 'src/pages/avgifter.json'
        fields:
          - { label: 'Titel', name: 'title', widget: 'string', default: 'Tränings- och medlemsavgifter' }
          - { label: 'Gällande år / termin', name: 'year', widget: 'string', default: '2026' }
          - { label: 'Introduktionstext', name: 'introText', widget: 'text' }
          - { label: 'Kontakt e-post för fakturafrågor', name: 'contactEmail', widget: 'string', default: 'kassor@osterlenbudo.se' }
          - label: 'Avgiftskategorier'
            name: 'categories'
            widget: 'list'
            summary: '{{fields.name}} – {{fields.price}} ({{fields.period}})'
            fields:
              - { label: 'Kategori / Gruppnamn', name: 'name', widget: 'string' }
              - { label: 'Avgift (t.ex. 500 kr)', name: 'price', widget: 'string' }
              - { label: 'Period (t.ex. per termin / per år)', name: 'period', widget: 'string' }
              - { label: 'Ålder / Målgrupp', name: 'age', widget: 'string', required: false }
              - { label: 'Beskrivning / Info', name: 'description', widget: 'string', required: false }
          - label: 'Förmåner & Betalningsinfo (t.ex. Friskvård, Fritidskortet)'
            name: 'benefits'
            widget: 'list'
            summary: '{{fields.title}}'
            fields:
              - { label: 'Rubrik', name: 'title', widget: 'string' }
              - { label: 'Beskrivning', name: 'description', widget: 'text' }



  - name: 'settings'
    label: 'Inställningar'
    delete: false
    editor:
      preview: false
    files:
      - name: 'homepage'
        label: 'Startsida (Hem)'
        file: 'src/pages/homepage.json'
        fields:
          - { label: 'Välkomsttitel', name: 'welcomeTitle', widget: 'string' }
          - { label: 'Välkomsttext', name: 'welcomeText', widget: 'text' }
          - { label: 'Viktigt meddelande (Visas högst upp)', name: 'announcementActive', widget: 'boolean', default: false }
          - { label: 'Meddelandetext', name: 'announcementText', widget: 'string', required: false }
          - { label: 'Meddelandelänk', name: 'announcementLink', widget: 'string', required: false }
          - label: 'Snabblänkar'
            name: 'quickLinks'
            widget: 'list'
            fields:
              - { label: 'Titel', name: 'title', widget: 'string' }
              - { label: 'Beskrivning', name: 'description', widget: 'string' }
              - { label: 'Länk (t.ex. /borjatrana)', name: 'url', widget: 'string' }

      - name: 'termin'
        label: 'Terminstider (Schema)'
        file: 'src/pages/termin.json'
        fields:
          - { label: 'Terminsnamn', name: 'name', widget: 'string', default: 'Höstterminen 2026' }
          - { label: 'Startdatum', name: 'startDate', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', default: '2026-08-17' }
          - { label: 'Slutdatum', name: 'endDate', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', default: '2026-12-10' }
          - { label: 'Sista datum för intag av nybörjare', name: 'intakeEndDate', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', default: '2026-09-30', required: false }
          - { label: 'Informationstext', name: 'infoText', widget: 'string', required: false }

      - name: 'schema'
        label: 'Träningstider (Veckoschema)'
        file: 'src/pages/schema.json'
        fields:
          - { label: 'Titel', name: 'title', widget: 'string', default: 'Träningstider' }
          - label: 'Träningspass'
            name: 'sessions'
            widget: 'list'
            summary: '{{fields.day}} {{fields.time}} – {{fields.group}}'
            fields:
              - label: 'Veckodag'
                name: 'day'
                widget: 'select'
                options:
                  - 'Måndag'
                  - 'Tisdag'
                  - 'Onsdag'
                  - 'Torsdag'
                  - 'Fredag'
                  - 'Lördag'
                  - 'Söndag'
                default: 'Måndag'
              - { label: 'Sorteringsnummer (1=Mån, 2=Tis, 3=Ons, 4=Tor, 5=Fre, 6=Lör, 7=Sön)', name: 'dayOrder', widget: 'number', default: 1, value_type: 'int' }
              - { label: 'Tid (t.ex. 18:30 – 19:30)', name: 'time', widget: 'string' }
              - { label: 'Gruppnamn (t.ex. Barn fortsättning)', name: 'group', widget: 'string' }
              - { label: 'Ålder (t.ex. 7–12 år)', name: 'age', widget: 'string' }
              - label: 'Kategori'
                name: 'category'
                widget: 'select'
                options:
                  - { label: 'Stor & Liten (4–6 år)', value: 'small' }
                  - { label: 'Barn (7–12 år)', value: 'kids' }
                  - { label: 'Ungdomar (13–17 år)', value: 'youth' }
                  - { label: 'Vuxna (18+)', value: 'adults' }
                default: 'kids'
              - { label: 'Bälte (t.ex. Gult till grönt)', name: 'belt', widget: 'string' }
              - { label: 'Nivå (t.ex. Fortsättning)', name: 'level', widget: 'string' }









